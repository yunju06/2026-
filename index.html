<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>두산 베어스 2026 일정·기록</title>
  <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
  <header class="top">
    <select id="teamSel" class="team-sel" aria-label="구단 선택"></select>
    <nav>
      <a id="navAttend" href="#/">직관 기록</a>
      <a id="navCal" href="#/calendar">2026 일정·기록</a>
    </nav>
    <div id="sampleBadge" class="sample" hidden>샘플 데이터</div>
  </header>

  <main>
    <!-- 달력 화면 -->
    <section id="calendarView">
      <div class="cal-head">
        <button id="prevMonth" aria-label="이전 달">‹</button>
        <h2 id="monthTitle"></h2>
        <button id="nextMonth" aria-label="다음 달">›</button>
      </div>
      <div id="monthSummary" class="month-summary"></div>
      <div class="cal-grid cal-dow">
        <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div>
      </div>
      <div id="calGrid" class="cal-grid cal-body"></div>
      <div class="legend">
        <span><i class="lg home"></i>홈 경기</span>
        <span><i class="lg away"></i>원정 경기</span>
        <span class="w">승</span><span class="l">패</span><span class="d">무</span>
      </div>
    </section>

    <!-- 직관 페이지: 승률 | 기록 | (선택 시) 선수 기록 -->
    <section id="attendView" hidden>
      <div id="attendLayout" class="attend">
        <div class="panel" id="panelRate"></div>
        <div class="panel" id="panelList"></div>
        <div class="panel panel-detail" id="panelDetail"><div class="inner"></div></div>
      </div>
    </section>

    <!-- 경기 상세 화면 -->
    <section id="gameView" hidden>
      <div class="game-bar">
        <button id="backBtn" class="back">‹ 달력으로</button>
        <button id="attendBtn" class="attend-btn">+ 직관</button>
      </div>
      <div id="gameHead" class="game-head"></div>

      <div class="pager-tabs" role="tablist">
        <button role="tab" data-page="0" class="active">스코어 · 라인업</button>
        <button role="tab" data-page="1">선수 기록</button>
      </div>

      <div id="pager" class="pager">
        <div class="page" id="page0"></div>
        <div class="page" id="page1"></div>
      </div>
      <p class="swipe-hint">좌우로 밀어서 넘길 수 있어요 (← → 키도 가능)</p>
    </section>
  </main>

  <script src="data/teams.js"></script>
  <script src="data/schedule.js"></script>
  <script src="data/lastavg.js"></script>
  <script src="anim.js?v=18"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
